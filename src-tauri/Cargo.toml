[package]
name = "qingwen"
version = "0.3.0"
description = "轻文 · 基于 Tauri 2 + TipTap 的跨平台轻量级富文本编辑器"
authors = ["Qingwen"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "qingwen_lib"
# 桌面端只需要 rlib；不生成 cdylib，避免 Windows 上 DLL 导出符号数量限制。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
