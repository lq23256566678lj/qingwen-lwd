name: native-build

on:
  workflow_dispatch:
  push:
    tags:
      - "native-v*"

permissions:
  contents: read

jobs:
  build:
    name: Native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: qingwen-native-windows-x64
            binary: native/target/release/qingwen-native.exe
          - os: macos-latest
            artifact: qingwen-native-macos
            binary: native/target/release/qingwen-native
          - os: ubuntu-22.04
            artifact: qingwen-native-linux-x64
            binary: native/target/release/qingwen-native
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev libxkbcommon-dev libwayland-dev \
            libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgl1-mesa-dev libdbus-1-dev

      - name: Build native app
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Upload native binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
